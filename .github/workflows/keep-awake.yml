name: Mantener despierta la demo

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visitar la demo
        run: >-
          curl --fail --silent --show-error --output /dev/null
          --max-time 120 --retry 3 --retry-delay 15
          --write-out "HTTP %{http_code} en %{time_total}s\n"
          https://site-viewer-lite.onrender.com/
