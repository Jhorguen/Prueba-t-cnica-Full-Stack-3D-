<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Review a scanned building: project details, its spaces in 3D, the point cloud and issue reports.">
  <title>Site Viewer Lite</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/vendor/fonts/inter-tight/latin-400.css">
  <link rel="stylesheet" href="/vendor/fonts/inter-tight/latin-600.css">
  <link rel="stylesheet" href="/vendor/fonts/michroma/latin-400.css">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/addons/"
      }
    }
  </script>
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <div class="intro" aria-hidden="true">
    <span class="intro-wordmark">Site Viewer Lite</span>
  </div>
  <div class="app">
    <header class="topbar">
      <div class="topbar-start">
        <h1 class="wordmark">Site Viewer Lite</h1>
        <nav id="view-switch" class="view-switch" aria-label="Views" data-i18n-label="nav.views" hidden>
          <button type="button" class="view-tab" data-view="viewer" aria-pressed="true"><span data-i18n="nav.viewer">Viewer</span></button>
          <button type="button" class="view-tab" data-view="issues" aria-pressed="false"><span data-i18n="nav.issues">Issues</span><span id="issues-count" class="count-chip" hidden></span></button>
        </nav>
      </div>
      <div class="topbar-controls">
        <div class="language-switch" role="group" aria-label="Language" data-i18n-label="topbar.language">
          <button type="button" class="button language-option" data-language="en" lang="en" aria-label="English" aria-pressed="true">EN</button>
          <button type="button" class="button language-option" data-language="es" lang="es" aria-label="Español" aria-pressed="false">ES</button>
        </div>
        <div class="identity">
          <label class="topbar-label" for="user-select" data-i18n="topbar.viewingAs">Viewing as</label>
          <div class="select">
            <select id="user-select" class="control control-night">
              <option value="" data-i18n="topbar.chooseUser">Choose a user…</option>
            </select>
          </div>
        </div>
      </div>
    </header>

    <div class="sidebar">
      <section class="section nav" aria-labelledby="projects-title">
        <h2 id="projects-title" class="section-title" data-i18n="projects.title">Projects</h2>
        <div id="projects-status" aria-live="polite"></div>
        <ul id="project-list" class="project-list"></ul>
      </section>

      <div class="details">
        <section id="project-card" class="section" aria-labelledby="project-name" hidden>
          <h2 id="project-name" class="project-name"></h2>
          <p id="project-address" class="muted"></p>
          <dl id="project-dates" class="facts"></dl>
          <div id="project-contacts" class="contacts"></div>
        </section>

        <section id="issue-panel" class="section" aria-labelledby="issue-title-heading" hidden>
          <h2 id="issue-title-heading" class="section-title" data-i18n="issue.heading">Report an issue</h2>
          <form id="issue-form" class="form" novalidate>
            <div class="field">
              <label class="label" for="issue-title" data-i18n="issue.title">Title</label>
              <input id="issue-title" name="title" class="control" type="text" autocomplete="off" aria-describedby="issue-title-count issue-title-error">
              <div class="field-meta">
                <span id="issue-title-error" class="field-error"></span>
                <span id="issue-title-count" class="muted counter">0/120</span>
              </div>
            </div>
            <div class="field">
              <label class="label" for="issue-level" data-i18n="issue.level">Level</label>
              <div class="select">
                <select id="issue-level" name="level" class="control" aria-describedby="issue-level-error"></select>
              </div>
              <span id="issue-level-error" class="field-error"></span>
            </div>
            <div class="field">
              <span class="label" id="issue-space-label" data-i18n="issue.space">Space</span>
              <div class="space-slot" aria-labelledby="issue-space-label">
                <span id="issue-space">None. Tap a room in the 3D view to attach it.</span>
                <button id="issue-space-clear" class="button button-quiet" type="button" hidden>Remove</button>
              </div>
              <span id="issue-space-error" class="field-error"></span>
            </div>
            <button id="issue-submit" class="button button-primary" type="submit">Submit issue</button>
            <div id="issue-result" aria-live="polite"></div>
          </form>
        </section>
      </div>
    </div>

    <main class="viewer">
      <div class="toolbar">
        <div id="level-filter" class="level-filter" role="group" aria-label="Show level" data-i18n-label="levels.groupLabel"></div>
        <div class="cloud-controls">
          <button id="cloud-load" class="button button-primary" type="button" disabled>Load point cloud</button>
          <button id="cloud-toggle" class="button" type="button" aria-pressed="true" hidden>Hide point cloud</button>
          <div id="cloud-progress" class="cloud-progress" hidden>
            <progress id="cloud-progress-bar" max="1" value="0" aria-label="Point cloud download"></progress>
            <span id="cloud-progress-text" class="progress-text" aria-live="polite"></span>
            <button id="cloud-cancel" class="button" type="button">Cancel</button>
          </div>
        </div>
      </div>
      <div id="cloud-status" class="cloud-status"></div>

      <div id="stage" class="stage">
        <div id="stage-message" class="stage-message">Choose a user, then a project, to see its spaces in 3D.</div>
        <aside id="inspector" class="inspector" aria-labelledby="inspector-name" hidden>
          <div class="inspector-head">
            <h2 id="inspector-name" class="inspector-name"></h2>
            <button id="inspector-close" class="button button-quiet" type="button" aria-label="Close space details" data-i18n="inspector.close" data-i18n-label="inspector.closeLabel">Close</button>
          </div>
          <dl class="facts">
            <dt data-i18n="inspector.use">Use</dt><dd id="inspector-use"></dd>
            <dt data-i18n="inspector.level">Level</dt><dd id="inspector-level"></dd>
            <dt data-i18n="inspector.area">Area</dt><dd id="inspector-area" class="figure"></dd>
          </dl>
          <button id="unit-toggle" class="button" type="button">Show in ft²</button>
        </aside>
      </div>
    </main>

    <section id="admin" class="admin" aria-labelledby="admin-title" hidden>
      <div class="admin-head">
        <div class="admin-heading">
          <h2 id="admin-title" class="section-title" data-i18n="admin.title">Issue reports</h2>
          <p id="admin-meta" class="admin-meta" aria-live="polite"></p>
        </div>
        <div id="admin-filter" class="admin-filter" role="group" aria-label="Show status" data-i18n-label="admin.filterLabel"></div>
      </div>
      <div id="admin-notice"></div>
      <div id="admin-body" class="admin-body"></div>
    </section>
  </div>
</body>
</html>
